<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      background-color: #fff7f9;
      color: #58705b;
      font-family: "Trebuchet MS", Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 16px;
    }
    .card {
      background-color: #ffffff;
      padding: 16px;
      border-radius: 20px;
      border: 2px solid #b7cdb8;
      box-shadow: 0 4px 12px #f0d9df;
    }
    h1 {
      color: #86a889;
      font-size: 22px;
      margin-top: 0;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #68786b;
      margin-top: 0;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      border: 2px solid #b7cdb8;
      border-radius: 12px;
      box-sizing: border-box;
      color: #58705b;
      font-family: Arial, sans-serif;
      font-size: 13px;
      resize: vertical;
    }
    button {
      background-color: #f3b6c5;
      color: white;
      border: none;
      border-radius: 18px;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
    }
    button:hover {
      background-color: #eaa1b4;
    }
    .heartline {
      font-size: 24px;
      color: #eaa1b4;
      margin: 8px 0;
    }
    .box {
      background-color: #f1f7ef;
      border-radius: 12px;
      padding: 10px;
      margin-top: 10px;
      text-align: left;
      font-size: 12px;
    }
    #result {
      display: none;
    }
    ul {
      padding-left: 18px;
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SageShield</h1>
    <p>Paste email content to analyze for safety.</p>

    <textarea id="emailText" placeholder="Paste email content here..."></textarea>
    <button id="analyzeBtn">Analyze email</button>

    <div id="result">
      <div class="heartline" id="heartline"></div>
      <h3 id="verdict" style="color:#86a889; margin: 4px 0; font-size: 16px;"></h3>
      <p id="message" style="font-size:12px; margin: 4px 0;"></p>
      <p style="font-size:12px;"><b>Confidence score: <span id="score"></span>%</b></p>

      <div class="box">
        <b style="color: #86a889;">Why was it rated this way?</b>
        <ul id="reasons"></ul>
      </div>

      <div class="box" style="white-space: pre-wrap; word-break: break-word;">
        <b style="color: #86a889;">Highlighted email:</b>
        <p id="highlighted" style="margin: 4px 0;"></p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
